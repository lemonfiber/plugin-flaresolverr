# The SonarCloud issue gate (Q-R64). A bundled part holds no code a scan reads.
name: sonar
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  gate:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@c5e71bae1a1e2a7c499fa85a4679501d041eafaf # v1.0.136
    with:
      allowed-open: 0
      code: false
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
