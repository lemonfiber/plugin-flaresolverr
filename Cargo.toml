[package]
name = "flaresolverr-adapter"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/plugin-flaresolverr"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "Speaks lemonfiber's indexer.proxy contract in front of FlareSolverr, through its API"
publish = false

[[bin]]
name = "flaresolverr-adapter"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "f1613877bd9141210c49dfa168830343c811a0e0" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "f1613877bd9141210c49dfa168830343c811a0e0" }
lemonfiber-outward = { git = "https://github.com/lemonfiber/lemonfiber", rev = "f1613877bd9141210c49dfa168830343c811a0e0" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "f1613877bd9141210c49dfa168830343c811a0e0" }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
lemonfiber-fixtures = { git = "https://github.com/lemonfiber/lemonfiber", rev = "f1613877bd9141210c49dfa168830343c811a0e0" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
lemonfiber-plugin = { git = "https://github.com/lemonfiber/lemonfiber", rev = "f1613877bd9141210c49dfa168830343c811a0e0" }
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
